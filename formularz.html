    <!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularz</title>
</head>
<body>
    <form action="skrypt.php" method="post">
        <fieldset>
            <legend>Dane osobowe</legend>

            <div>
                <label for="imie">Imię:</label>
                <input type="text" id="imie" name="imie" placeholder="Imię" required>
            </div>

            <div>
                <label for="telefon">Telefon:</label>
                <input
                    type="tel"
                    id="telefon"
                    name="telefon"
                    placeholder="+48 555-555-555"
                    pattern="[+][0-9]{2} [0-9]{3}-[0-9]{3}-[0-9]"
                    required
                >
            </div>

            <div>
                <label for="email">E-mail:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="japuszko@wp.pl"
                    required
                >
            </div>

            <div>
                <label for="wiek">Wiek:</label>
                <input type="number" id="wiek" name="wiek" min="18" max="100" placeholder="wiek" required>
            </div>

            <div>
                <label for="haslo">Hasło:</label>
                <input type="password" id="haslo" name="haslo" placeholder="hasło" required>
            </div>
        </fieldset>

        <fieldset>
            <legend>Płeć</legend>

            <label>
                <input type="radio" name="plec" value="mezczyzna" checked>
                Mężczyzna
            </label>

            <label>
                <input type="radio" name="plec" value="kobieta">
                Kobieta
            </label>

            <label>
                <input type="radio" name="plec" value="inna">
                Inna
            </label>
        </fieldset>

        <fieldset>
            <legend>Informacje o zamówieniu</legend>

            <div>
                <label for="kategoria">Kategoria:</label>
                <select id="kategoria" name="kategoria" required>
                    <option value="" disabled selected>Wybierz kategorię</option>
                    <optgroup label="Produkty">
                        <option value="japuszki">Japuszki</option>
                        <option value="odziez">Odzież</option>
                        <option value="ksiazki">Książki</option>
                        <option value="elektronika">Elektronika</option>
                    </optgroup>
                </select>
            </div>

            <div>
                <label for="termin">Preferowany termin dostawy:</label>
                <input type="date" id="termin" name="termin">
            </div>

            <div>
                <label for="wiadomosc">Wiadomość:</label>
                <textarea
                    id="wiadomosc"
                    name="wiadomosc"
                    rows="6"
                    cols="40"
                    placeholder="Napisz szczegóły zamówienia"
                ></textarea>
            </div>

            <label>
                <input type="checkbox" name="zgoda_reklama" value="tak">
                Wyrażam zgodę na reklamę
            </label>

            <label>
                <input type="checkbox" name="regulamin" value="tak" required>
                Akceptuję regulamin
            </label>
        </fieldset>

        <button type="submit">Wyślij</button>
    </form>
</body>
</html>

    </body>
</html>
