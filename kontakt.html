<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt | Sklep z japuszkami</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="site-header__inner">
            <h1>Kontakt</h1>
            <nav class="site-nav" aria-label="Nawigacja główna">
                <a href="img/index.html">Sklep</a>
                <a href="formularz.html">Zamówienie</a>
                <a href="kontakt.html" aria-current="page">Kontakt</a>
            </nav>
        </div>
    </header>

    <main class="site-main page-main">
        <section aria-labelledby="naglowek-kontaktu">
            <h2 class="section-title" id="naglowek-kontaktu">Napisz do nas</h2>
            <form action="#" method="post">
                <div class="form-field">
                    <label for="imie">Imię:</label>
                    <input type="text" id="imie" name="imie" autocomplete="name" required>
                </div>
                <div class="form-field">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>
                <div class="form-field">
                    <label for="temat">Temat wiadomości:</label>
                    <select id="temat" name="temat" required>
                        <option value="" disabled selected>Wybierz temat wiadomości</option>
                        <option value="reklamacja">Reklamacja</option>
                        <option value="zapytanie">Zapytanie</option>
                        <option value="wspolpraca">Współpraca</option>
                        <option value="oferta">Oferta</option>
                        <option value="inne">Inne</option>
                    </select>
                </div>
                <fieldset>
                    <legend>Preferowana forma kontaktu</legend>
                    <div class="form-options">
                        <label class="form-option"><input type="radio" name="forma_kontaktu" value="telefon"> Telefon</label>
                        <label class="form-option"><input type="radio" name="forma_kontaktu" value="email"> E-mail</label>
                        <label class="form-option"><input type="radio" name="forma_kontaktu" value="messenger"> Messenger</label>
                    </div>
                </fieldset>
                <div class="form-field">
                    <label for="wiadomosc">Wiadomość:</label>
                    <textarea id="wiadomosc" name="wiadomosc" rows="6" required></textarea>
                </div>
                <label class="form-option"><input type="checkbox" id="zgoda" name="zgoda" value="tak" required> Zgadzam się na przetwarzanie moich danych osobowych.</label>
                <button class="form-submit" type="submit">Wyślij</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="site-footer__inner">
            <p><a href="img/index.html">Powrót do sklepu</a></p>
        </div>
    </footer>
</body>
</html>
